name: Debug AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    name: Diagnose AWS OIDC trust
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims and AWS role configuration
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          role = os.environ.get('AWS_DEPLOY_ROLE_ARN', '')
          expected = 'arn:aws:iam::840514731609:role/wonderland-github-actions-deployer'
          print('Role secret configured:', bool(role))
          print('Role ARN matches expected:', role == expected)
          print('GitHub repository:', os.environ.get('GITHUB_REPOSITORY', 'missing'))
          print('GitHub ref:', os.environ.get('GITHUB_REF', 'missing'))

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          separator = '&' if '?' in url else '?'
          url += separator + urllib.parse.urlencode({'audience': 'sts.amazonaws.com'})
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('--- Safe OIDC claims ---')
          for key in ('iss', 'aud', 'sub', 'repository', 'ref', 'environment'):
              print(f'{key}: {claims.get(key, "not present")}')
          print('--- End OIDC claims ---')
          PY

      - name: Attempt AWS role assumption
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: wonderland-oidc-debug
          retry-max-attempts: 1

      - name: Confirm assumed AWS identity
        run: aws sts get-caller-identity
