name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_eks:
        description: Provision or update the opt-in EKS migration stack and deploy Kubernetes workloads.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: wonderland-production
  PROJECT_NAME: wonderland
  ENVIRONMENT_NAME: production
  DATABASE_PROTECTION_MODE: development
  EKS_STACK_NAME: wonderland-eks

jobs:
  validate:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Validate service source
        run: |
          for service in api-gateway auth-service user-service business-service; do
            npm ci --prefix "backend/$service"
            find "backend/$service/src" -name '*.js' -print0 | xargs -0 -n1 node --check
          done

  deploy:
    name: Deploy AWS infrastructure and application
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://wonderland-infrastructure.yaml

      - name: Create or update infrastructure
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            bootstrap_application_secret=false
            stack_status=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)
            case "$stack_status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                create_services=true
                ;;
              ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED|UPDATE_ROLLBACK_FAILED)
                echo "::error title=CloudFormation stack requires recovery::$STACK_NAME is $stack_status. Review the CloudFormation Events tab, resolve retained resources, then manually delete or recover the stack before deploying again."
                exit 1
                ;;
              *)
                echo "::error title=CloudFormation stack is busy or unavailable::$STACK_NAME is $stack_status. Wait for the current operation to finish before deploying."
                exit 1
                ;;
            esac
          else
            create_services=false
            bootstrap_application_secret=true
          fi
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file wonderland-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              DatabaseProtectionMode="$DATABASE_PROTECTION_MODE" \
              BootstrapApplicationSecret="$bootstrap_application_secret" \
              CreateApplicationServices="$create_services"

      - name: Show CloudFormation failure details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager || true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push service images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in api-gateway auth-service user-service business-service; do
            image="$ECR_REGISTRY/$PROJECT_NAME-$ENVIRONMENT_NAME-$service"
            docker build --tag "$image:$IMAGE_TAG" --tag "$image:latest" "backend/$service"
            docker push "$image:$IMAGE_TAG"
            docker push "$image:latest"
          done

      - name: Publish React frontend to S3
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          frontend_bucket=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/dist "s3://$frontend_bucket" --delete

      - name: Start ECS services after the first image publish
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file wonderland-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              DatabaseProtectionMode="$DATABASE_PROTECTION_MODE" \
              BootstrapApplicationSecret=false \
              CreateApplicationServices=true

      - name: Diagnose ECS service deployment failure
        if: failure()
        run: |
          echo 'CloudFormation failed resources:'
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager || true

          cluster_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -z "$cluster_name" ] || [ "$cluster_name" = "None" ]; then
            echo 'ECS cluster output is unavailable; see the CloudFormation failures above.'
            exit 0
          fi

          echo 'Recent ECS service events:'
          for service in api-gateway auth-service user-service business-service; do
            aws ecs describe-services \
              --cluster "$cluster_name" \
              --services "$PROJECT_NAME-$ENVIRONMENT_NAME-$service" \
              --query 'services[0].events[0:10].[createdAt,message]' \
              --output table \
              --no-cli-pager || true
          done

      - name: Refresh CloudFront and ECS services
        run: |
          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          cluster_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'
          for service in api-gateway auth-service user-service business-service; do
            aws ecs update-service \
              --cluster "$cluster_name" \
              --service "$PROJECT_NAME-$ENVIRONMENT_NAME-$service" \
              --force-new-deployment
          done

      - name: Show deployed frontend and API endpoints
        run: |
          frontend_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)
          api_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "Frontend: $frontend_url"
          echo "API: $api_url"

  deploy-eks:
    name: Deploy opt-in EKS migration
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_eks }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Set up kubectl and Helm
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate EKS CloudFormation template
        run: aws cloudformation validate-template --template-body file://infrastructure/eks-cluster.yaml

      - name: Create or update EKS infrastructure
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          if aws cloudformation describe-stacks --stack-name "$EKS_STACK_NAME" >/dev/null 2>&1; then
            eks_status=$(aws cloudformation describe-stacks \
              --stack-name "$EKS_STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)
            case "$eks_status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
              *)
                echo "::error title=EKS stack requires manual recovery::$EKS_STACK_NAME is $eks_status. Review CloudFormation Events; this workflow will not delete or recreate resources."
                exit 1
                ;;
            esac
          fi

          aws cloudformation deploy \
            --stack-name "$EKS_STACK_NAME" \
            --template-file infrastructure/eks-cluster.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              ExistingVpcId="$(get_output VpcId)" \
              ExistingPublicSubnetOneId="$(get_output PublicSubnetOneId)" \
              ExistingPublicSubnetTwoId="$(get_output PublicSubnetTwoId)" \
              ExistingPrivateSubnetOneId="$(get_output PrivateSubnetOneId)" \
              ExistingPrivateSubnetTwoId="$(get_output PrivateSubnetTwoId)" \
              ExistingDatabaseSecurityGroupId="$(get_output DatabaseSecurityGroupId)"

      - name: Configure kubectl for EKS
        run: |
          eks_cluster=$(aws cloudformation describe-stacks \
            --stack-name "$EKS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" \
            --output text)
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$eks_cluster"
          kubectl get nodes -o wide

      - name: Install AWS Load Balancer Controller
        run: |
          eks_cluster=$(aws cloudformation describe-stacks \
            --stack-name "$EKS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" \
            --output text)
          vpc_id=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
            --output text)
          kubectl apply -f kubernetes/aws-load-balancer-controller-service-account.yaml
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$eks_cluster" \
            --set region="$AWS_REGION" \
            --set vpcId="$vpc_id" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=5m

      - name: Deploy Kubernetes workloads
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          frontend_url=$(get_output FrontendUrl)
          database_endpoint=$(get_output DatabaseEndpoint)
          database_username=$(get_output DatabaseApplicationUsername)
          database_name=$(get_output DatabaseApplicationName)
          application_secret_arn=$(get_output ApplicationSecretsArn)
          account_id=$(aws sts get-caller-identity --query Account --output text)
          ecr_registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          secret_json=$(aws secretsmanager get-secret-value --secret-id "$application_secret_arn" --query SecretString --output text)

          kubectl apply -f kubernetes/namespace.yaml
          sed \
            -e "s|__DATABASE_HOST__|$database_endpoint|g" \
            -e "s|__DATABASE_USER__|$database_username|g" \
            -e "s|__DATABASE_NAME__|$database_name|g" \
            -e "s|__FRONTEND_ORIGIN__|$frontend_url|g" \
            kubernetes/configmap.yaml | kubectl apply -f -

          kubectl create secret generic wonderland-application --namespace wonderland \
            --from-literal=DB_PASSWORD="$(jq -r '.DB_PASSWORD // ""' <<<"$secret_json")" \
            --from-literal=STRIPE_SECRET_KEY="$(jq -r '.STRIPE_SECRET_KEY // ""' <<<"$secret_json")" \
            --from-literal=SMTP_HOST="$(jq -r '.SMTP_HOST // ""' <<<"$secret_json")" \
            --from-literal=SMTP_PORT="$(jq -r '.SMTP_PORT // ""' <<<"$secret_json")" \
            --from-literal=SMTP_SECURE="$(jq -r '.SMTP_SECURE // "false"' <<<"$secret_json")" \
            --from-literal=SMTP_USER="$(jq -r '.SMTP_USER // ""' <<<"$secret_json")" \
            --from-literal=SMTP_PASSWORD="$(jq -r '.SMTP_PASSWORD // ""' <<<"$secret_json")" \
            --from-literal=SMTP_FROM="$(jq -r '.SMTP_FROM // ""' <<<"$secret_json")" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f kubernetes/services.yaml
          for manifest in kubernetes/*-deployment.yaml; do
            sed \
              -e "s|__ECR_REGISTRY__|$ecr_registry|g" \
              -e "s|__IMAGE_TAG__|$GITHUB_SHA|g" \
              "$manifest" | kubectl apply -f -
          done
          for deployment in api-gateway auth-service user-service business-service; do
            kubectl rollout status "deployment/$deployment" -n wonderland --timeout=5m
          done
          kubectl apply -f kubernetes/ingress.yaml

      - name: Verify EKS API and promote CloudFront origin
        run: |
          for attempt in {1..30}; do
            eks_api_host=$(kubectl get ingress wonderland-api -n wonderland \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$eks_api_host" ]; then
              break
            fi
            sleep 20
          done
          test -n "$eks_api_host"
          curl --fail --retry 5 --retry-delay 5 "http://$eks_api_host/health"

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file wonderland-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              DatabaseProtectionMode="$DATABASE_PROTECTION_MODE" \
              BootstrapApplicationSecret=false \
              CreateApplicationServices=true \
              ApiOriginDomain="$eks_api_host"

          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          frontend_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)
          api_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          eks_cluster=$(aws cloudformation describe-stacks \
            --stack-name "$EKS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'
          curl --fail --location --retry 5 --retry-delay 10 "$frontend_url"
          curl --fail --location --retry 5 --retry-delay 10 "$api_url/health"
          echo "Frontend: $frontend_url"
          echo "API: $api_url"
          echo "EKS cluster: $eks_cluster"
          echo "EKS API load balancer: http://$eks_api_host"

      - name: Diagnose EKS deployment failure
        if: failure()
        run: |
          kubectl get deployments,pods,services,ingress -n wonderland -o wide || true
          kubectl get events -n wonderland --sort-by=.lastTimestamp || true
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller -o wide || true
          aws cloudformation describe-stack-events \
            --stack-name "$EKS_STACK_NAME" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager || true

