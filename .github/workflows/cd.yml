name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: wonderland-production
  PROJECT_NAME: wonderland
  ENVIRONMENT_NAME: production
  DATABASE_PROTECTION_MODE: development
  EKS_STACK_NAME: wonderland-eks
  AMPLIFY_STACK_NAME: wonderland-amplify
  AMPLIFY_GITHUB_TOKEN_SECRET_NAME: wonderland/production/amplify-github-token

jobs:
  validate:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Validate service source
        run: |
          for service in api-gateway auth-service user-service business-service; do
            npm ci --prefix "backend/$service"
            find "backend/$service/src" -name '*.js' -print0 | xargs -0 -n1 node --check
          done

  deploy:
    name: Deploy AWS infrastructure and application
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://wonderland-infrastructure.yaml

      - name: Create or update infrastructure
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            bootstrap_application_secret=false
            stack_status=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)
            case "$stack_status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                create_services=true
                ;;
              ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED|UPDATE_ROLLBACK_FAILED)
                echo "::error title=CloudFormation stack requires recovery::$STACK_NAME is $stack_status. Review the CloudFormation Events tab, resolve retained resources, then manually delete or recover the stack before deploying again."
                exit 1
                ;;
              *)
                echo "::error title=CloudFormation stack is busy or unavailable::$STACK_NAME is $stack_status. Wait for the current operation to finish before deploying."
                exit 1
                ;;
            esac
          else
            create_services=false
            bootstrap_application_secret=true
          fi
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file wonderland-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              DatabaseProtectionMode="$DATABASE_PROTECTION_MODE" \
              BootstrapApplicationSecret="$bootstrap_application_secret" \
              CreateApplicationServices="$create_services"

      - name: Show CloudFormation failure details
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager || true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push service images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in api-gateway auth-service user-service business-service; do
            image="$ECR_REGISTRY/$PROJECT_NAME-$ENVIRONMENT_NAME-$service"
            docker build --tag "$image:$IMAGE_TAG" --tag "$image:latest" "backend/$service"
            docker push "$image:$IMAGE_TAG"
            docker push "$image:latest"
          done

      - name: Publish React frontend to S3
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          frontend_bucket=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/dist "s3://$frontend_bucket" --delete

      - name: Start ECS services after the first image publish
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file wonderland-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              DatabaseProtectionMode="$DATABASE_PROTECTION_MODE" \
              BootstrapApplicationSecret=false \
              CreateApplicationServices=true

      - name: Diagnose ECS service deployment failure
        if: failure()
        run: |
          echo 'CloudFormation failed resources:'
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager || true

          cluster_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -z "$cluster_name" ] || [ "$cluster_name" = "None" ]; then
            echo 'ECS cluster output is unavailable; see the CloudFormation failures above.'
            exit 0
          fi

          echo 'Recent ECS service events:'
          for service in api-gateway auth-service user-service business-service; do
            aws ecs describe-services \
              --cluster "$cluster_name" \
              --services "$PROJECT_NAME-$ENVIRONMENT_NAME-$service" \
              --query 'services[0].events[0:10].[createdAt,message]' \
              --output table \
              --no-cli-pager || true
          done

      - name: Refresh CloudFront and ECS services
        run: |
          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          cluster_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'
          for service in api-gateway auth-service user-service business-service; do
            aws ecs update-service \
              --cluster "$cluster_name" \
              --service "$PROJECT_NAME-$ENVIRONMENT_NAME-$service" \
              --force-new-deployment
          done

      - name: Show deployed frontend and API endpoints
        run: |
          frontend_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)
          api_origin_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiOriginUrl'].OutputValue" \
            --output text)
          api_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "Frontend: $frontend_url"
          echo "API origin: $api_origin_url"
          echo "API: $api_url"

  deploy-amplify:
    name: Deploy Amplify frontend hosting
    needs: deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy and verify Amplify frontend hosting
        run: |
          aws cloudformation validate-template --template-body file://infrastructure/amplify-hosting.yaml >/dev/null
          aws secretsmanager describe-secret \
            --secret-id "$AMPLIFY_GITHUB_TOKEN_SECRET_NAME" \
            --no-cli-pager >/dev/null || {
              echo "::error title=Amplify GitHub token secret is missing::Create the AWS Secrets Manager secret $AMPLIFY_GITHUB_TOKEN_SECRET_NAME with JSON key token before deploying Amplify."
              exit 1
            }

          api_gateway_base_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiOriginUrl'].OutputValue" \
            --output text)

          api_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          if [ -z "$api_gateway_base_url" ] || [ "$api_gateway_base_url" = "None" ]; then
            echo "::error title=API origin is unavailable::$STACK_NAME does not publish ApiOriginUrl. Deploy the application stack successfully before deploying Amplify."
            exit 1
          fi
          if ! [[ "$api_gateway_base_url" =~ ^https://[^/]+$ ]]; then
            echo "::error title=API origin is invalid::ApiOriginUrl must be an HTTPS origin without a path; received an invalid stack output."
            exit 1
          fi
          if [ -z "$api_url" ] || [ "$api_url" = "None" ] || ! [[ "$api_url" =~ ^https://[^/]+/api$ ]]; then
            echo "::error title=API endpoint is unavailable::$STACK_NAME must publish a valid public ApiUrl ending in /api before deploying Amplify."
            exit 1
          fi
          if [ "$api_url" != "$api_gateway_base_url/api" ]; then
            echo "::error title=API output mismatch::ApiOriginUrl and ApiUrl must describe the same public API endpoint."
            exit 1
          fi

          echo "Using public API origin $api_gateway_base_url for the Amplify frontend build."
          echo "The frontend will send API requests to $api_url."

          aws cloudformation deploy \
            --stack-name "$AMPLIFY_STACK_NAME" \
            --template-file infrastructure/amplify-hosting.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              GitHubAccessTokenSecretName="$AMPLIFY_GITHUB_TOKEN_SECRET_NAME" \
              ApiGatewayBaseUrl="$api_gateway_base_url"

          amplify_app_id=$(aws cloudformation describe-stacks \
            --stack-name "$AMPLIFY_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AmplifyAppId'].OutputValue" \
            --output text)
          if [ -z "$amplify_app_id" ] || [ "$amplify_app_id" = "None" ]; then
            echo "::error title=Amplify application is unavailable::$AMPLIFY_STACK_NAME did not publish AmplifyAppId."
            exit 1
          fi

          amplify_service_role_arn=$(aws cloudformation describe-stacks \
            --stack-name "$AMPLIFY_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AmplifyServiceRoleArn'].OutputValue" \
            --output text)
          if [ -z "$amplify_service_role_arn" ] || [ "$amplify_service_role_arn" = "None" ]; then
            echo "::error title=Amplify service role is unavailable::$AMPLIFY_STACK_NAME did not publish AmplifyServiceRoleArn."
            exit 1
          fi

          amplify_github_token=$(aws secretsmanager get-secret-value \
            --secret-id "$AMPLIFY_GITHUB_TOKEN_SECRET_NAME" \
            --query 'SecretString' \
            --output text \
            --no-cli-pager | jq -er '.token') || {
              echo "::error title=Amplify GitHub token is invalid::$AMPLIFY_GITHUB_TOKEN_SECRET_NAME must contain JSON with a non-empty token key."
              exit 1
            }
          echo "::add-mask::$amplify_github_token"
          echo 'Refreshing the existing Amplify GitHub repository connection.'
          aws amplify update-app \
            --app-id "$amplify_app_id" \
            --access-token "$amplify_github_token" \
            --no-cli-pager >/dev/null
          unset amplify_github_token

          # This static WEB app uses the existing dedicated Amplify service role.
          app_platform=""
          configured_service_role=""
          configured_compute_role=""
          stable_configuration_reads=0
          for attempt in $(seq 1 12); do
            read -r app_platform configured_service_role configured_compute_role < <(aws amplify get-app \
              --app-id "$amplify_app_id" \
              --query 'app.[platform, iamServiceRoleArn, computeRoleArn]' \
              --output text \
              --no-cli-pager)
            if [ "$app_platform" = "WEB" ] \
              && [ "$configured_service_role" = "$amplify_service_role_arn" ] \
              && { [ -z "$configured_compute_role" ] || [ "$configured_compute_role" = "None" ]; }; then
              stable_configuration_reads=$((stable_configuration_reads + 1))
              if [ "$stable_configuration_reads" -ge 3 ]; then
                break
              fi
            else
              stable_configuration_reads=0
            fi
            sleep 5
          done
          if [ "$stable_configuration_reads" -lt 3 ] \
            || [ "$app_platform" != "WEB" ] \
            || [ "$configured_service_role" != "$amplify_service_role_arn" ] \
            || { [ -n "$configured_compute_role" ] && [ "$configured_compute_role" != "None" ]; }; then
            echo "::error title=Amplify role configuration is invalid::Expected three consecutive reads of platform WEB with iamServiceRoleArn=$amplify_service_role_arn and no compute role. Found platform=$app_platform, iamServiceRoleArn=$configured_service_role, computeRoleArn=$configured_compute_role."
            exit 1
          fi
          echo "Amplify configuration verified: platform=WEB, service role=$amplify_service_role_arn, compute role unset."

          amplify_job_id=$(aws amplify start-job \
            --app-id "$amplify_app_id" \
            --branch-name main \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text \
            --no-cli-pager)
          if [ -z "$amplify_job_id" ] || [ "$amplify_job_id" = "None" ]; then
            echo "::error title=Amplify build was not started::Amplify did not return a build job ID for $amplify_app_id."
            exit 1
          fi

          report_amplify_job() {
            echo 'Amplify job summary:'
            aws amplify get-job \
              --app-id "$amplify_app_id" \
              --branch-name main \
              --job-id "$amplify_job_id" \
              --query 'job.summary.[status,statusReason]' \
              --output table \
              --no-cli-pager || true
            echo 'Amplify build-step logs:'
            aws amplify get-job \
              --app-id "$amplify_app_id" \
              --branch-name main \
              --job-id "$amplify_job_id" \
              --query 'job.steps[].[stepName,status,statusReason,logUrl]' \
              --output table \
              --no-cli-pager || true

            failed_log_urls=$(aws amplify get-job \
              --app-id "$amplify_app_id" \
              --branch-name main \
              --job-id "$amplify_job_id" \
              --query "job.steps[?status=='FAILED'].logUrl" \
              --output text \
              --no-cli-pager 2>/dev/null || true)
            if [ -n "$failed_log_urls" ] && [ "$failed_log_urls" != "None" ]; then
              echo 'Failed Amplify build-step log excerpt:'
              for log_url in $failed_log_urls; do
                if ! (set -o pipefail; curl --fail --silent --show-error --location "$log_url" | tail -n 120); then
                  echo 'Unable to retrieve the failed build-step log excerpt.'
                fi
              done
            fi
          }

          for attempt in {1..60}; do
            job_status=$(aws amplify get-job \
              --app-id "$amplify_app_id" \
              --branch-name main \
              --job-id "$amplify_job_id" \
              --query 'job.summary.status' \
              --output text)
            case "$job_status" in
              SUCCEED)
                amplify_url=$(aws cloudformation describe-stacks \
                  --stack-name "$AMPLIFY_STACK_NAME" \
                  --query "Stacks[0].Outputs[?OutputKey=='AmplifyFrontendUrl'].OutputValue" \
                  --output text)
                echo "Amplify frontend: $amplify_url"
                exit 0
                ;;
              FAILED|CANCELLED)
                report_amplify_job
                echo "::error title=Amplify frontend build failed::Amplify job $amplify_job_id failed. The step log URLs are listed above."
                exit 1
                ;;
              *) sleep 15 ;;
            esac
          done

          report_amplify_job
          echo '::error title=Amplify frontend build timed out::No successful Amplify build completed within 15 minutes. The latest job details are listed above.'
          exit 1

  deploy-eks:
    name: Deploy EKS workloads
    needs: [deploy, deploy-amplify]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Set up kubectl and Helm
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate EKS CloudFormation template
        run: aws cloudformation validate-template --template-body file://infrastructure/eks-cluster.yaml

      - name: Verify EKS node group service-linked role access
        run: |
          caller_arn=$(aws sts get-caller-identity --query Arn --output text --no-cli-pager)
          aws_partition=$(cut -d: -f2 <<<"$caller_arn")
          account_id=$(aws sts get-caller-identity --query Account --output text --no-cli-pager)
          expected_caller_prefix="arn:${aws_partition}:sts::${account_id}:assumed-role/${PROJECT_NAME}-github-actions-deployer/"
          if [[ "$caller_arn" != "$expected_caller_prefix"* ]]; then
            echo "::error title=Unexpected AWS deployment role::AWS_DEPLOY_ROLE_ARN must assume ${PROJECT_NAME}-github-actions-deployer. Active identity: $caller_arn"
            exit 1
          fi

          if ! service_linked_role_arn=$(aws iam get-role \
            --role-name AWSServiceRoleForAmazonEKSNodegroup \
            --query 'Role.Arn' \
            --output text \
            --no-cli-pager); then
            echo "::error title=EKS bootstrap IAM permission missing::$caller_arn cannot read AWSServiceRoleForAmazonEKSNodegroup. Update the wonderland-github-oidc stack from an administrator session before rerunning CD."
            echo 'Required permission: iam:GetRole on arn:aws:iam::840514731609:role/aws-service-role/eks-nodegroup.amazonaws.com/*'
            exit 1
          fi
          expected_role_arn="arn:${aws_partition}:iam:${account_id}:role/aws-service-role/eks-nodegroup.amazonaws.com/AWSServiceRoleForAmazonEKSNodegroup"

          if [ "$service_linked_role_arn" != "$expected_role_arn" ]; then
            echo "::error title=Unexpected EKS service-linked role ARN::Expected $expected_role_arn but received $service_linked_role_arn. Review the AWS account and IAM role configuration."
            exit 1
          fi
          echo "Deployment identity: $caller_arn"
          echo "EKS node group service-linked role access verified: $service_linked_role_arn"

      - name: Create or update EKS infrastructure
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          report_eks_stack_failure() {
            echo 'Failed EKS CloudFormation resources:'
            aws cloudformation describe-stack-events \
              --stack-name "$EKS_STACK_NAME" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table \
              --no-cli-pager || true

            echo 'Most recent EKS CloudFormation events:'
            aws cloudformation describe-stack-events \
              --stack-name "$EKS_STACK_NAME" \
              --query 'StackEvents[0:25].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table \
              --no-cli-pager || true
          }

          if aws cloudformation describe-stacks --stack-name "$EKS_STACK_NAME" >/dev/null 2>&1; then
            eks_status=$(aws cloudformation describe-stacks \
              --stack-name "$EKS_STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)
            case "$eks_status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
              *)
                echo "::error title=EKS stack requires manual recovery::$EKS_STACK_NAME is $eks_status. Review CloudFormation Events; this workflow will not delete or recreate resources."
                report_eks_stack_failure
                exit 1
                ;;
            esac
          fi

          if ! aws cloudformation deploy \
            --stack-name "$EKS_STACK_NAME" \
            --template-file infrastructure/eks-cluster.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --disable-rollback \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              ExistingVpcId="$(get_output VpcId)" \
              ExistingPublicSubnetOneId="$(get_output PublicSubnetOneId)" \
              ExistingPublicSubnetTwoId="$(get_output PublicSubnetTwoId)" \
              ExistingPrivateSubnetOneId="$(get_output PrivateSubnetOneId)" \
              ExistingPrivateSubnetTwoId="$(get_output PrivateSubnetTwoId)" \
              ExistingDatabaseSecurityGroupId="$(get_output DatabaseSecurityGroupId)"; then
            echo '::error title=EKS CloudFormation deployment failed::See the failed resource events below for the AWS failure reason.'
            report_eks_stack_failure
            exit 1
          fi

          eks_cluster="$PROJECT_NAME-$ENVIRONMENT_NAME-eks"
          aws eks wait cluster-active --region "$AWS_REGION" --name "$eks_cluster"
          aws eks wait nodegroup-active --region "$AWS_REGION" --cluster-name "$eks_cluster" --nodegroup-name primary

      - name: Configure kubectl for EKS
        run: |
          eks_cluster=$(aws cloudformation describe-stacks \
            --stack-name "$EKS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" \
            --output text)
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$eks_cluster"
          kubectl get nodes -o wide

      - name: Install AWS Load Balancer Controller
        run: |
          eks_cluster=$(aws cloudformation describe-stacks \
            --stack-name "$EKS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" \
            --output text)
          vpc_id=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
            --output text)
          kubectl apply -f kubernetes/aws-load-balancer-controller-service-account.yaml
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$eks_cluster" \
            --set region="$AWS_REGION" \
            --set vpcId="$vpc_id" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=5m

      - name: Deploy Kubernetes workloads
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          frontend_url=$(aws cloudformation describe-stacks \
            --stack-name "$AMPLIFY_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AmplifyFrontendUrl'].OutputValue" \
            --output text)
          test -n "$frontend_url"
          test "$frontend_url" != "None"
          stripe_success_url="$frontend_url/payment-success?session_id={CHECKOUT_SESSION_ID}"
          stripe_cancel_url="$frontend_url/payment-cancel"
          database_endpoint=$(get_output DatabaseEndpoint)
          database_username=$(get_output DatabaseApplicationUsername)
          database_name=$(get_output DatabaseApplicationName)
          application_secret_arn=$(get_output ApplicationSecretsArn)
          account_id=$(aws sts get-caller-identity --query Account --output text)
          ecr_registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          secret_json=$(aws secretsmanager get-secret-value --secret-id "$application_secret_arn" --query SecretString --output text)

          kubectl apply -f kubernetes/namespace.yaml
          sed \
            -e "s|__DATABASE_HOST__|$database_endpoint|g" \
            -e "s|__DATABASE_USER__|$database_username|g" \
            -e "s|__DATABASE_NAME__|$database_name|g" \
            -e "s|__FRONTEND_ORIGIN__|$frontend_url|g" \
            -e "s|__STRIPE_SUCCESS_URL__|$stripe_success_url|g" \
            -e "s|__STRIPE_CANCEL_URL__|$stripe_cancel_url|g" \
            kubernetes/configmap.yaml | kubectl apply -f -

          kubectl create secret generic wonderland-application --namespace wonderland \
            --from-literal=DB_PASSWORD="$(jq -r '.DB_PASSWORD // ""' <<<"$secret_json")" \
            --from-literal=STRIPE_SECRET_KEY="$(jq -r '.STRIPE_SECRET_KEY // ""' <<<"$secret_json")" \
            --from-literal=SMTP_HOST="$(jq -r '.SMTP_HOST // ""' <<<"$secret_json")" \
            --from-literal=SMTP_PORT="$(jq -r '.SMTP_PORT // ""' <<<"$secret_json")" \
            --from-literal=SMTP_SECURE="$(jq -r '.SMTP_SECURE // "false"' <<<"$secret_json")" \
            --from-literal=SMTP_USER="$(jq -r '.SMTP_USER // ""' <<<"$secret_json")" \
            --from-literal=SMTP_PASSWORD="$(jq -r '.SMTP_PASSWORD // ""' <<<"$secret_json")" \
            --from-literal=SMTP_FROM="$(jq -r '.SMTP_FROM // ""' <<<"$secret_json")" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f kubernetes/services.yaml
          for manifest in kubernetes/*-deployment.yaml; do
            sed \
              -e "s|__ECR_REGISTRY__|$ecr_registry|g" \
              -e "s|__IMAGE_TAG__|$GITHUB_SHA|g" \
              "$manifest" | kubectl apply -f -
          done
          for deployment in api-gateway auth-service user-service business-service; do
            kubectl rollout status "deployment/$deployment" -n wonderland --timeout=5m
          done
          kubectl apply -f kubernetes/ingress.yaml

      - name: Verify EKS API and promote CloudFront origin
        run: |
          for attempt in {1..30}; do
            eks_api_host=$(kubectl get ingress wonderland-api -n wonderland \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$eks_api_host" ]; then
              break
            fi
            sleep 20
          done
          test -n "$eks_api_host"
          curl --fail --retry 5 --retry-delay 5 "http://$eks_api_host/health"

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file wonderland-infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              EnvironmentName="$ENVIRONMENT_NAME" \
              DatabaseProtectionMode="$DATABASE_PROTECTION_MODE" \
              BootstrapApplicationSecret=false \
              CreateApplicationServices=true \
              ApiOriginDomain="$eks_api_host"

          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          amplify_frontend_url=$(aws cloudformation describe-stacks \
            --stack-name "$AMPLIFY_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AmplifyFrontendUrl'].OutputValue" \
            --output text)
          api_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          eks_cluster=$(aws cloudformation describe-stacks \
            --stack-name "$EKS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EksClusterName'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'
          curl --fail --location --retry 5 --retry-delay 10 "$amplify_frontend_url"
          curl --fail --location --retry 5 --retry-delay 10 "$api_url/health"
          echo "Amplify frontend: $amplify_frontend_url"
          echo "API: $api_url"
          echo "EKS cluster: $eks_cluster"
          echo "EKS API load balancer: http://$eks_api_host"

      - name: Diagnose EKS deployment failure
        if: failure()
        run: |
          kubectl get deployments,pods,services,ingress -n wonderland -o wide || true
          kubectl get events -n wonderland --sort-by=.lastTimestamp || true
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller -o wide || true
          aws cloudformation describe-stack-events \
            --stack-name "$EKS_STACK_NAME" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager || true

