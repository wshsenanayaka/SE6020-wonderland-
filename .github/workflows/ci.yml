name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, business-service]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install service dependencies
        run: npm ci --prefix backend/${{ matrix.service }}

      - name: Check JavaScript syntax
        run: find backend/${{ matrix.service }}/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run service tests when present
        run: npm test --prefix backend/${{ matrix.service }} --if-present

      - name: Build service container
        run: docker build --tag wonderland/${{ matrix.service }}:ci backend/${{ matrix.service }}

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run frontend tests when present
        run: npm test --prefix frontend --if-present

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  infrastructure:
    name: Validate infrastructure and Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CloudFormation linter
        run: pip install cfn-lint

      - name: Validate CloudFormation templates
        run: cfn-lint wonderland-infrastructure.yaml infrastructure/eks-cluster.yaml infrastructure/github-oidc-role.yaml

      - name: Validate Kubernetes manifests offline
        run: |
          mapfile -d '' manifests < <(find kubernetes -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
          test "${#manifests[@]}" -gt 0
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict \
            -summary \
            -verbose \
            -kubernetes-version 1.35.0 \
            "${manifests[@]}"

