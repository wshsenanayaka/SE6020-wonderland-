name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, business-service]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install service dependencies
        run: npm ci --prefix backend/${{ matrix.service }}

      - name: Check JavaScript syntax
        run: find backend/${{ matrix.service }}/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build service container
        run: docker build --tag wonderland/${{ matrix.service }}:ci backend/${{ matrix.service }}

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

