
AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for Wonderland CI/CD deployments.

Parameters:
  ProjectName:
    Type: String
    Default: wonderland
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'

Resources:

  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-actions-deployer'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubActionsOidcProvider

            Action:
              - sts:AssumeRoleWithWebIdentity

            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: 'repo:wshsenanayaka/SE6020-wonderland-:environment:production'

      Policies:
        - PolicyName: !Sub '${ProjectName}-deployment-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ManageWonderlandInfrastructure
                Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - elasticloadbalancing:*
                  - rds:*
                  - servicediscovery:*
                  - logs:*
                  - secretsmanager:*
                  - s3:*
                  - cloudfront:*
                Resource: '*'

              - Sid: ManageWonderlandTaskRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'

              # Route 53 requires wildcard resources for hosted-zone creation and discovery.
              - Sid: DiscoverAndCreatePrivateHostedZones
                Effect: Allow
                Action:
                  - route53:CreateHostedZone
                  - route53:GetHostedZoneCount
                  - route53:ListHostedZones
                  - route53:ListHostedZonesByName
                  - route53:ListHostedZonesByVPC
                Resource: '*'

              # Existing hosted-zone actions are constrained to Route 53 hosted zones.
              - Sid: ManageCloudMapPrivateHostedZones
                Effect: Allow
                Action:
                  - route53:AssociateVPCWithHostedZone
                  - route53:ChangeResourceRecordSets
                  - route53:ChangeTagsForResource
                  - route53:DeleteHostedZone
                  - route53:DisassociateVPCFromHostedZone
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'

              - Sid: ReadHostedZoneChanges
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub 'arn:${AWS::Partition}:route53:::change/*'

              - Sid: CreateRequiredServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com
                      - servicediscovery.amazonaws.com

Outputs:

  DeploymentRoleArn:
    Description: GitHub Actions AWS deployment role ARN.
    Value: !GetAtt GitHubActionsDeploymentRole.Arn
