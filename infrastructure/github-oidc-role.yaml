AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for Wonderland CI/CD deployments.

Parameters:
  GitHubOrganization:
    Type: String
    Description: GitHub user or organization that owns the repository.
  GitHubRepository:
    Type: String
    Description: Repository name only, without the owner.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to deploy to AWS.
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub Actions environment allowed to deploy to AWS.
  ProjectName:
    Type: String
    Default: wonderland
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'

Resources:
  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-actions-deployer'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubActionsOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrganization}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrganization}/${GitHubRepository}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: !Sub '${ProjectName}-deployment-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageWonderlandInfrastructure
                Effect: Allow
                Action:
                  - cloudformation:*
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - elasticloadbalancing:*
                  - rds:*
                  - servicediscovery:*
                  - logs:*
                  - secretsmanager:*
                  - s3:*
                  - cloudfront:*
                Resource: '*'
              - Sid: ManageWonderlandTaskRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              - Sid: CreateRequiredServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com

Outputs:
  DeploymentRoleArn:
    Description: Add this value as the AWS_DEPLOY_ROLE_ARN GitHub Actions secret.
    Value: !GetAtt GitHubActionsDeploymentRole.Arn

