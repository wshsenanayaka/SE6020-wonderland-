AWSTemplateFormatVersion: '2010-09-09'
Description: Wonderland React frontend hosting through AWS Amplify and the GitHub App.

Parameters:
  ProjectName:
    Type: String
    Default: wonderland
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  GitHubRepositoryUrl:
    Type: String
    Default: https://github.com/wshsenanayaka/SE6020-wonderland-
    AllowedPattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/?$'
  GitHubBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
  GitHubAccessTokenSecretName:
    Type: String
    Default: wonderland/production/amplify-github-token
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]+$'
    Description: Secrets Manager secret name containing JSON key token for the Amplify GitHub App connection.
  ApiGatewayBaseUrl:
    Type: String
    AllowedPattern: '^https://[^/]+$'
    Description: Public CloudFront origin embedded into the Vite build as VITE_API_BASE_URL.

Resources:
  # This static WEB app has no Amplify backend or SSR compute resources. The role
  # only resolves a stale/invalid app role while keeping Amplify's access scoped.
  AmplifyHostingServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-amplify-hosting'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/*'

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-frontend'
      Description: Wonderland React frontend hosted by AWS Amplify.
      Platform: WEB
      Repository: !Ref GitHubRepositoryUrl
      AccessToken: !Sub '{{resolve:secretsmanager:${GitHubAccessTokenSecretName}:SecretString:token}}'
      IAMServiceRole: !GetAtt AmplifyHostingServiceRole.Arn
      EnableBranchAutoDeletion: false
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: frontend
        - Name: VITE_API_BASE_URL
          Value: !Ref ApiGatewayBaseUrl
      BuildSpec: |
        version: 1
        applications:
          - appRoot: frontend
            frontend:
              phases:
                preBuild:
                  commands:
                    - nvm use 20
                    - node --version
                    - npm --version
                    - test -n "$VITE_API_BASE_URL"
                    - echo "Building the Vite frontend against $VITE_API_BASE_URL"
                    - npm ci
                build:
                  commands:
                    - npm run build
                    - test -f dist/index.html
              artifacts:
                baseDirectory: dist
                files:
                  - '**/*'
              cache:
                paths:
                  - node_modules/**/*
      CustomRules:
        - Source: </^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map)$)([^.]+$)/>
          Target: /index.html
          Status: '200'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AmplifyMainBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref GitHubBranch
      EnableAutoBuild: true
      Stage: PRODUCTION

Outputs:
  AmplifyAppId:
    Description: Amplify application identifier.
    Value: !GetAtt AmplifyApp.AppId
  AmplifyServiceRoleArn:
    Description: Dedicated IAM role assumed by Amplify Hosting for this static frontend.
    Value: !GetAtt AmplifyHostingServiceRole.Arn
  AmplifyFrontendUrl:
    Description: Public HTTPS URL for the main Amplify branch.
    Value: !Sub 'https://${GitHubBranch}.${AmplifyApp.DefaultDomain}'
