apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: wonderland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8089
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: wonderland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 4001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: wonderland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 4002
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: business-service
  namespace: wonderland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: business-service
  ports:
    - name: http
      port: 4003
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: wonderland
  labels:
    app.kubernetes.io/name: metabase
    app.kubernetes.io/part-of: wonderland
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metabase
  ports:
    - name: http
      port: 3000
      targetPort: http
