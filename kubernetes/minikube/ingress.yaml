apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wonderland-web
  namespace: wonderland
spec:
  ingressClassName: nginx
  rules:
    - host: wonderland.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: api.wonderland.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
