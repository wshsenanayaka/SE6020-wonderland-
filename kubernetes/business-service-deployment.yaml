apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-service
  namespace: wonderland
  labels:
    app.kubernetes.io/name: business-service
    app.kubernetes.io/part-of: wonderland
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: business-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-service
    spec:
      containers:
        - name: business-service
          image: __ECR_REGISTRY__/wonderland-production-business-service:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4003
          envFrom:
            - configMapRef:
                name: wonderland-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: DB_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: STRIPE_SECRET_KEY
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: SMTP_SECURE
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: wonderland-application
                  key: SMTP_FROM
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 512Mi
